<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>

    p  { color: #555; font-size: 0.95rem; line-height: 1.6; }
    .btn { display: inline-block; margin-top: 24px; padding: 14px 32px;
           background: #4f46e5; color: white; text-decoration: none;
           border-radius: 8px; font-size: 1rem; font-weight: 600; }
    .btn:hover { background: #4338ca; }
    .note { margin-top: 20px; font-size: 0.82rem; color: #888; }
    .version { display: inline-block; margin-top: 10px; background: #f0f0f0;

  <div class="card">

      إذا طلب المتصفح تأكيد التثبيت، اضغط "إضافة".
    </p>
  </div>
</body>
</html>
